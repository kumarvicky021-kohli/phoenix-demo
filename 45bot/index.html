  const SETS = [['startBal', 'Starting paper balance ($)', 'Shuruaati paper balance ($)', 100, 1e6, 100], ['slPct', 'Stop-loss %', 'Stop-loss %', 0.5, 5, 0.1], ['tpPct', 'Take-profit % (7–10)', 'Take-profit % (7–10)', 7, 10, 0.5], ['trailAct', 'Trailing starts at +%', 'Trailing kab shuru +%', 5, 10, 0.5], ['trailGap', 'Trailing gap %', 'Trailing gap %', 0.5, 5, 0.1], ['riskPct', 'Risk per trade % (0.5–2)', 'Risk per trade % (0.5–2)', 0.5, 2, 0.1], ['maxPosPct', 'Max % of balance per trade', 'Ek trade me max % balance', 5, 50, 1], ['maxOpen', 'Max open positions', 'Max open positions', 1, 5, 1], ['lossStreakStop', 'Pause after N losses in a row', 'Lagatar N loss pe pause', 1, 5, 1], ['dayLossStop', 'Daily loss stop %', 'Daily loss stop %', 1, 10, 0.5], ['minLiq', 'Min liquidity $', 'Min liquidity $', 100000, 1e8, 50000], ['minVol', 'Min 24h volume $', 'Min 24h volume $', 100000, 1e9, 50000], ['minAgeH', 'Min pair age (h)', 'Min pair age (ghante)', 24, 1e5, 1], ['maxRtCost', 'Max round-trip cost %', 'Max round-trip cost %', 0.1, 2, 0.05], ['minRR', 'Min reward:risk', 'Min reward:risk', 2, 6, 0.1], ['rsiLow', 'RSI dip level', 'RSI dip level', 20, 50, 1], ['volMult', 'Volume confirm (× avg)', 'Volume confirm (× avg)', 1, 3, 0.1], ['defFeeSide', 'Fee/side if unknown %', 'Fee/side (agar pata na ho) %', 0, 1, 0.01], ['slipBuf', 'Slippage buffer/side %', 'Slippage buffer/side %', 0, 1, 0.01], ['targetWin10', 'Target wins per 10', '10 me target jeet', 5, 10, 1], ['targetTph', 'Trades/hour goal (display only)', 'Trades/ghanta goal (sirf dikhane ke liye)', 1, 60, 1], ['scanSec', 'Scan every (sec)', 'Scan har (sec)', 30, 600, 5]];
  function hSet() { return `<div class="card"><h3>${T('Settings (exact values)', 'Settings (exact values)')}</h3>${SETS.map(s => `<label class="s"><span class="sm">${T(s[2], s[1])}</span><input type="number" data-k="${s[0]}" min="${s[3]}" max="${s[4]}" step="${s[5]}" value="${cfg[s[0]]}"></label>`).join('')}<label class="s"><span class="sm">${T('Trailing stop (+7% ke baad)', 'Trailing stop (after +7%)')}</span><input type="checkbox" data-k="trailOn" ${cfg.trailOn ? 'checked' : ''}></label>
    <div style="display:flex;gap:8px;margin-top:10px"><button id="setDef">${T('Default wapas', 'Defaults')}</button><button class="dan" id="reset">${T('Balance reset', 'Reset balance')}</button></div></div>
    <div class="card"><h3>${T('Strategy (entry signal)', 'Strategy (entry signal)')}</h3><div class="sm">${T(`1) 5m chart: price EMA50 ke upar aur EMA20 > EMA50 (uptrend). 2) 1m chart: pichhli ${cfg.pullbackBars} candles me price EMA20 tak wapas aaya aur RSI ${cfg.rsiLow} se neeche gaya. 3) Ab RSI ${cfg.rsiLow} ke upar aur badh raha, green candle EMA20 ke upar close. 4) Volume ≥ ${cfg.volMult}× average. 5) Purana resistance (12h se 2h pehle tak ka high) kam se kam ~7% upar ho ya price us se upar ho: reward:risk ≥ ${cfg.minRR}. Tabhi paper buy.`, `1) 5m: price > EMA50 and EMA20 > EMA50 (uptrend). 2) 1m: within last ${cfg.pullbackBars} candles price pulled back to EMA20 and RSI dipped below ${cfg.rsiLow}. 3) Now RSI back ≥ ${cfg.rsiLow} and rising, green candle closing above EMA20. 4) Volume ≥ ${cfg.volMult}× avg. 5) Room to older resistance (high from 12h→2h ago) gives reward:risk ≥ ${cfg.minRR}. Only then paper buy.`)}</div></div>
    <div class="card"><h3>${T('Paise kaise lagte hain (fees)', 'Cost model')}</h3><div class="sm">${T(`Har side: pool fee (GoPlus se, na mile to ${cfg.defFeeSide}%) + price impact (size ÷ aadhi liquidity) + network ${cfg.netCostSide}% + slippage ${cfg.slipBuf}%. SL/TP price se lagte hain; net P&L me ye sab kat ke dikhta hai.`, `Per side: pool fee (from GoPlus, else ${cfg.defFeeSide}%) + price impact (size ÷ half liquidity) + network ${cfg.netCostSide}% + slippage ${cfg.slipBuf}%. SL/TP trigger on price; net P&L includes all costs.`)}</div></div>`; }
  function render() { nav(); $('#lang').textContent = lang === 'hi' ? 'EN' : 'हिं'; const rb = $('#runBtn'); rb.textContent = S.running ? '⏸' : '▶'; rb.className = 'sm ' + (S.running ? 'dan' : 'pri');
    const el = $('#pg-' + cur); el.innerHTML = ({ home: hHome, coins: hCoins, log: hLog, hist: hHist, bt: hBt, set: hSet })[cur]();
    if (cur === 'home') { renderOpen(); eqChart($('#eq'), S.eq); } }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-p]'); if (a) { e.preventDefault(); go(a.dataset.p); return; }
    const c = e.target.closest('[data-close]'); if (c) { const p = S.open.find(x => x.id === c.dataset.close); if (p && confirm(T('Ye paper position abhi bech dein?', 'Close this paper position now?'))) closePos(p, lastPx[p.pair] || p.entryMid, 'MAN'); return; }
    if (e.target.id === 'lang') { lang = lang === 'hi' ? 'en' : 'hi'; LS.set('lang', lang); render(); }
    if (e.target.id === 'runBtn') { S.running = !S.running; log('BOT', 'info', S.running ? R('▶ Bot shuru (paper)', '▶ Bot started (paper)') : R('⏸ Bot roka', '⏸ Bot stopped')); save(); render(); }
    if (e.target.id === 'uniRef') { refreshUni(true).catch(err => log('SCAN', 'err', R(err.message, err.message))); }
    if (e.target.id === 'btRun') runBt();
    if (e.target.id === 'setDef') { cfg = Object.assign({}, E.DEF); LS.set('cfg', cfg); render(); }
    if (e.target.id === 'reset' && confirm(T('Paper balance, trades aur history reset karein?', 'Reset paper balance, trades and history?'))) { const run = S.running; S = fresh(); S.running = run; save(); log('BOT', 'info', R(`Reset: naya paper balance $${cfg.startBal}`, `Reset: new paper balance $${cfg.startBal}`)); render(); }
  });
  document.addEventListener('change', (e) => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; if (k === 'trailOn') cfg.trailOn = e.target.checked; else { const s = SETS.find(x => x[0] === k); let v = +e.target.value; if (!isFinite(v)) return; v = Math.min(s[4], Math.max(s[3], v)); cfg[k] = v; e.target.value = v; } LS.set('cfg', cfg); if (k === 'startBal' && !S.trades.length && !S.open.length) { S.bal = S.startBal = cfg.startBal; S.eq = [{ t: Date.now(), v: cfg.startBal }]; save(); } });
  window.V45APP = { get S() { return S; }, get cfg() { return cfg; }, set cfg(v) { cfg = v; }, openPos, closePos, onPrice, render, go, runBt, refreshUni, get uni() { return uni; }, set uni(v) { uni = v; }, BT };
  render(); priceLoop(); scanLoop();
})();
</script></body></html>
