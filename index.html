<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D0D0F"><meta name="robots" content="noindex">
<title>Phoenix · Phoenix GMGN v2.3.0 (DEMO paper)</title><style>:root{--bg:#0D0D0F;--s1:#17181B;--s2:#17181B;--s3:#26282C;--line:#26282C;--txt:#F5F5F5;--mut:#5C6068;--mut2:#4A4E55;--up:#6BD98A;--dn:#E8506E;--org:#FF9A2E;--buy:#6BD98A;--sell:#E8506E;--ink:#0D0D0F;--card:#17181B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Noto Sans",Roboto,sans-serif;font-size:14px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.hidden{display:none!important}
#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
.view,.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);-webkit-overflow-scrolling:touch}
.view{display:none;padding-bottom:96px}.view.on{display:block}
.page{z-index:30;display:none}
.bbar,#tpanel{display:none}.page.on{display:block}
::-webkit-scrollbar{width:0;height:0}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 12px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.hexb{width:34px;height:34px;flex:none;display:grid;place-items:center;color:#fff}
.sbar{flex:1;height:38px;border-radius:19px;background:var(--s3);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mut);font-size:14px;text-align:left}
.sbar b{color:#d8d8da;font-weight:500;display:flex;align-items:center;gap:4px}
/* banner */
.banner{margin:6px 12px 4px;height:62px;border-radius:12px;background:linear-gradient(100deg,#0b2a1c,#12402b 70%,#0e3322);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 14px}
.banner .bt{font-weight:700;font-size:14px;line-height:1.25;max-width:62%;z-index:1}
.banner .px{position:absolute;right:0;top:0;bottom:0;width:42%;background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(70,255,150,.18) 7px 8px),repeating-linear-gradient(90deg,transparent 0 7px,rgba(70,255,150,.18) 7px 8px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 50%);mask-image:linear-gradient(90deg,transparent,#000 50%)}
.banner .px:after{content:"";position:absolute;right:20px;top:14px;width:28px;height:28px;background:#37f08f;box-shadow:-14px 14px 0 #1fae65,14px -7px 0 #2ad47c,-28px 0 0 #168a50;opacity:.85}
.dots{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:4px}.dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:#fff}
/* tabs */
.tabs{display:flex;align-items:center;gap:22px;padding:10px 14px 4px}
.tabs button{color:var(--mut);font-weight:600;font-size:16px;padding-bottom:6px;position:relative}
.tabs button.on{color:#fff}.tabs button.on:after{content:"";position:absolute;left:50%;bottom:0;width:18px;height:3px;border-radius:2px;background:#fff;transform:translateX(-50%)}
.tabs .feed{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;color:var(--mut);background:var(--s3);display:flex;align-items:center;gap:4px;margin-bottom:6px}
.feed i{width:6px;height:6px;border-radius:50%;background:#e8a317}.feed.on i{background:var(--up)}.feed.off i{background:var(--dn)}
/* list — flat rows ~90px, not cards */
.lh{display:grid;grid-template-columns:1fr 84px 84px;padding:6px 14px;color:var(--mut);font-size:11px}
.lh span:nth-child(2){text-align:right}.lh span:nth-child(3){text-align:right}
.trow{display:grid;grid-template-columns:44px 1fr 84px 84px;gap:10px;align-items:center;padding:14px 14px;min-height:90px;border-bottom:1px solid var(--line);background:transparent}
.trow:active{background:rgba(255,255,255,.03)}
.ic{position:relative;width:44px;height:44px;border-radius:10px;background:var(--s3);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff}
.icw{position:relative;width:44px;height:44px;flex:none}
.icw .ic{width:100%;height:100%}
.icw .ch{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1.5px solid var(--bg);display:grid;place-items:center;overflow:hidden}
.ch i{display:block;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#9945ff,#14f195)}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
.nm{display:flex;align-items:center;gap:6px;min-width:0}.nm b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
.age{font-size:10.5px;color:#b5b7bd;background:var(--s3);border-radius:8px;padding:1px 6px;font-weight:500;flex:none}
.hy{display:flex;align-items:center;gap:3px;color:var(--org);font-size:12px;margin-top:3px}
.c2,.c3{text-align:right;display:flex;flex-direction:column;gap:3px}.c2 b,.c3 b{font-size:14px;font-weight:600}.c2 span{color:var(--mut);font-size:12px}.c3 span{font-size:13px;font-weight:600}
.empty{padding:50px 24px;text-align:center;color:var(--mut);line-height:1.6}
.note{font-size:10.5px;color:var(--mut2);text-align:center;padding:10px 20px 4px}
/* floating bottom nav */
#bnav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:2px;background:rgba(23,24,27,.96);border:1px solid var(--line);border-radius:32px;padding:6px;z-index:20;width:min(92%,380px);justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#9a9ca3;font-size:10.5px;font-weight:600;padding:5px 0 3px;border-radius:26px}
#bnav button.on{color:#fff}
#bnav button .bi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
#bnav button.on .bi{background:#fff;color:#0D0D0F}
/* search page */
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.shead .inp{flex:1;height:40px;border-radius:20px;background:var(--s3);border:0;padding:0 12px;display:flex;align-items:center;gap:6px}
.shead input{flex:1;background:none;border:0;outline:none;min-width:0;font-size:15px}
.shead .go{background:#fff;color:#0D0D0F;font-weight:700;border-radius:20px;height:38px;padding:0 16px}
.rec{padding:6px 14px}.rec h4{margin:6px 0 10px;display:flex;justify-content:space-between;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--s3);border-radius:8px;padding:5px 8px;font-size:13px}
.pill .ic{width:22px;height:22px;border-radius:5px;font-size:11px}.pill .x{color:var(--mut);margin-left:2px}
.stabs{display:flex;gap:24px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.stabs button{color:var(--mut);font-weight:600;font-size:15px;padding-bottom:8px;position:relative}.stabs button.on{color:#fff}.stabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#fff;border-radius:2px}
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:14px 14px;align-items:start;min-height:90px;border-bottom:1px solid var(--line)}
.srow .l2,.srow .l3{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;margin-top:4px}
.srow .l1{display:flex;align-items:center;gap:6px}.srow .l1 b{font-size:15px}
.srow .l3 .lq{color:var(--mut)}.srow .l3 b{color:#cfd0d4;font-weight:500}
.srow .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.srow .r .m{font-size:13px;color:var(--mut)}.srow .r .m b{color:#fff;font-size:14px;font-weight:700}
.srow .r .v{font-size:12px;color:var(--mut)}.srow .r .v b{color:#cfd0d4;font-weight:500}
.star{margin-top:4px;color:var(--mut)}.star.on{color:#ffcb3d}
/* token page */
.th{position:sticky;top:0;background:var(--bg);z-index:8;display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
.th .bk{width:28px;height:36px;display:grid;place-items:center}
.th .tid{flex:1;min-width:0}.th .tn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px}.th .tn small{font-weight:500;color:var(--mut);font-size:12px}
.th .ts{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12px;margin-top:2px}.th .ts .a{color:#E8506E}
.th .acts{display:flex;gap:14px;color:#d5d6da;padding-right:4px}
.th .ic{width:38px;height:38px;border-radius:9px}
.mcb{display:flex;justify-content:space-between;padding:4px 14px 2px;gap:10px}
.mcb .l .lab{color:var(--mut);font-size:11px;display:flex;align-items:center;gap:4px}
.mcb .l .big{display:flex;align-items:baseline;gap:8px}.big b{font-size:28px;font-weight:700;letter-spacing:-.5px}.big span{font-size:14px;font-weight:600}
.mcb .r{width:42%;text-align:right;font-size:11px;color:var(--mut)}.ath{height:4px;border-radius:2px;background:var(--s3);margin:4px 0 0;overflow:hidden}.ath i{display:block;height:100%;background:linear-gradient(90deg,#6BD98A,#e8d447)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:6px 14px}
.sec .icons{display:flex;gap:11px;color:#8c8f96;align-items:center}
.chk{display:flex;gap:5px}.chk i{width:15px;height:15px;border-radius:50%;background:var(--up);display:grid;place-items:center;color:#000}.chk i.w{background:var(--org)}.chk i.b{background:var(--dn)}
.risk{display:flex;gap:0;padding:6px 14px 8px;overflow-x:auto;align-items:center}
.risk div{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--mut);padding-right:12px;white-space:nowrap}
.risk b{font-size:14px;color:#fff;font-weight:600}.risk b.o{color:var(--org)}.risk b.g{color:var(--up)}.risk b.r{color:var(--dn)}
.tfr{display:flex;align-items:center;gap:2px;padding:4px 10px;position:relative}
.tfr button{padding:5px 11px;border-radius:14px;color:var(--mut);font-size:13px;font-weight:600}.tfr button.on{background:var(--s3);color:#fff}
.tfr .sp{flex:1}.tfr .more.on{background:var(--s3);color:#fff}
.moremenu{position:absolute;top:34px;left:150px;background:var(--s1);border:1px solid var(--s3);border-radius:10px;padding:4px;z-index:12;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;box-shadow:0 10px 26px rgba(0,0,0,.7)}
.moremenu button{padding:7px 12px}
/* chart ABOVE FOLD ~380px */
#chartWrap{position:relative;height:380px;margin:0;background:var(--bg);border-top:1px solid #15151a}
body.panel #chartWrap{height:240px}
#chart,#subChart{position:absolute;inset:0}
#subWrap{position:relative;height:92px;border-top:1px solid #15151a}#subWrap #subChart{inset:0}
#subWrap .lbl{position:absolute;left:6px;top:2px;font-size:10px;color:var(--mut);z-index:3;pointer-events:none}
#bubLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.bub{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:auto;border:2px solid #fff;background:#222;overflow:visible;display:grid;place-items:center;font-size:8px;font-weight:800;color:#fff;line-height:1}
.bub.b{border-color:var(--buy)}.bub.s{border-color:var(--dn)}
.bub img{width:100%;height:100%;border-radius:50%;display:block;image-rendering:pixelated}
.bub u{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;border:1.5px solid #000;background:var(--buy)}.bub.s u{background:var(--dn)}
.bub.tag{width:auto;height:18px;border-radius:9px;padding:0 6px;margin-left:0;transform:translateX(-50%);background:#1b4fd8;font-size:10px}.bub.tag.s{background:#c4254a}.bub.tag.b{background:#1b4fd8}
#pxTag{position:absolute;right:0;z-index:5;background:#2a2a2f;color:#fff;font-size:10px;line-height:1.15;padding:2px 4px;border-radius:3px;pointer-events:none;text-align:center;min-width:46px}
#chartMsg{position:absolute;left:8px;top:6px;z-index:6;font-size:10.5px;color:#d9b45a;background:rgba(20,16,4,.82);border-radius:6px;padding:3px 7px;max-width:84%;pointer-events:none}
#chartMsg:empty{display:none}
#chartMsg.load{color:#aeb0b6;background:rgba(30,30,34,.8)}
#diag{font:10px/1.3 ui-monospace,Menlo,monospace;color:var(--mut2);padding:3px 12px 0;word-break:break-all}
#diag.bad{color:#d9a13a}
.inds{display:flex;align-items:center;gap:2px;padding:6px 8px;overflow-x:auto}
.inds button{padding:5px 9px;color:var(--mut);font-size:12.5px;font-weight:600;border-radius:12px;flex:none}.inds button.on{color:#fff;background:var(--s3)}.inds .bar{width:1px;height:14px;background:var(--s3);margin:0 4px;flex:none}
.utabs{display:flex;gap:18px;padding:6px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.utabs button{color:var(--mut);font-weight:600;font-size:14px;padding-bottom:8px;position:relative;white-space:nowrap}.utabs button.on{color:#fff}.utabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#fff}
.fpills{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;overflow-x:auto}
.fpills button{padding:5px 12px;border-radius:15px;background:var(--s3);color:var(--mut);font-size:12.5px;white-space:nowrap;flex:none}.fpills button.on{background:#2a2c30;color:#fff}
.qr{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;color:var(--mut);font-size:12.5px}
.qr .bt{display:flex;align-items:center;gap:6px;background:#0d0d0f;border:1px solid var(--s3);border-radius:14px;padding:4px 10px;color:#fff}.qr .bt.off{color:var(--mut)}
.qr .rn{display:flex;align-items:center;gap:5px}.qr .rn.on{color:var(--up)}
.urow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 14px}
.urow .av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#222}.urow .av img{width:100%;height:100%;image-rendering:pixelated}
.urow .n{font-size:13.5px;font-weight:600;display:flex;gap:5px;align-items:center}.urow .n em{font-style:normal;font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 4px;background:var(--s3);color:#b9bbc2}
.urow .n em.s{background:#18321f;color:var(--up)}.urow .n em.d{background:#3a1a22;color:var(--dn)}.urow .n em.k{background:#1c2542;color:#7c9bff}
.urow .sub{font-size:11.5px;color:var(--mut);margin-top:2px}.urow .rr{text-align:right;font-size:13px;font-weight:600}.urow .rr small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:2px}
.bbar{position:absolute;left:0;right:0;bottom:0;z-index:35;display:none;gap:10px;padding:10px 12px 14px;background:linear-gradient(0deg,var(--bg) 70%,rgba(13,13,15,0))}
.bbar button{flex:1;height:46px;border-radius:23px;font-weight:800;font-size:16px;color:#0D0D0F}.bbar .by{background:var(--buy)}.bbar .sl{background:var(--sell)}
body.tokon:not(.panel) .bbar{display:flex}
.tbpad{height:92px}body.panel .tbpad{height:360px}
/* Instant trade panel */
#tpanel{position:absolute;left:0;right:0;bottom:0;z-index:36;background:#0D0D0F;border-top:1px solid var(--s3);border-radius:16px 16px 0 0;padding:6px 12px 12px;display:none;box-shadow:0 -10px 30px rgba(0,0,0,.7)}
body.tokon.panel #tpanel{display:block}
.pt{display:flex;align-items:center;gap:16px;padding:4px 0 8px}
.pt button.m{color:var(--mut);font-weight:600;font-size:14px;padding:3px 0;position:relative}.pt button.m.on{color:#fff}.pt button.m.on:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:#fff;border-radius:1px}
.pt .sp{flex:1}.pt .dd{display:flex;align-items:center;gap:3px;background:var(--s3);border-radius:6px;padding:3px 8px;font-size:12px;color:#cfd0d4}
.pt .x{color:var(--mut);padding:4px}
.ps{padding:4px 0 6px}.ps .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.ps .h .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}.ps .h .t.b{color:var(--buy)}.ps .h .t.s{color:var(--sell)}
.ps .bal{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}.ps .bal b{color:#d6d7db;font-weight:500}
.qb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qb button{height:36px;border-radius:7px;font-weight:700;font-size:14px}.qb.b button{background:#0f3d24;color:#7dffb4}.qb.s button{background:#47202b;color:#ff9db6}
.qb button:active{filter:brightness(1.4)}
.pf{display:flex;align-items:center;gap:12px;margin-top:7px;font-size:11.5px;color:var(--mut);white-space:nowrap}
.pf span{display:flex;align-items:center;gap:3px}.pf b{color:#c9cad0;font-weight:500}
.pin{display:flex;gap:8px;margin:2px 0 8px}.pin input{flex:1;height:38px;border-radius:8px;background:var(--s3);border:1px solid var(--line);padding:0 10px;min-width:0;outline:none}
.pdemo{font-size:9.5px;color:var(--org);font-weight:700;letter-spacing:.3px}
.bigb{width:100%;height:42px;border-radius:21px;font-weight:800;font-size:15px;color:#0D0D0F;margin-top:4px}.bigb.b{background:var(--buy)}.bigb.s{background:var(--sell)}
/* sheet + toast */
#sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}#sheetBg.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#141416;border-radius:18px 18px 0 0;padding:16px 16px 22px;max-height:82%;overflow-y:auto;transform:translateY(105%);transition:transform .18s}
#sheet.on{transform:none}
#sheet h3{margin:0 0 10px;font-size:16px}
.sh-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.sh-row .sub{font-size:11.5px;color:var(--mut)}
.seg{display:flex;gap:6px}.seg button{padding:6px 12px;border-radius:14px;background:var(--s3);color:var(--mut);font-weight:600;font-size:13px}.seg button.on{background:#fff;color:#0D0D0F}
.sbtn{background:#fff;color:#0D0D0F;font-weight:700;border-radius:20px;padding:10px 18px;margin-top:12px;width:100%}.sbtn.g{background:var(--s3);color:#fff}
.sh-inp{width:100%;height:42px;border-radius:10px;background:var(--s3);border:1px solid var(--line);padding:0 12px;outline:none;margin-top:6px}
#toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);background:#222226;color:#fff;border-radius:18px;padding:9px 16px;z-index:60;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.card{margin:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h4{margin:0 0 8px;font-size:14px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.big2{font-size:26px;font-weight:700}
.bubtip{position:absolute;z-index:9;background:#232328;border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.4;max-width:200px;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.7)}
.spin{display:inline-block;width:9px;height:9px;border:2px solid #666;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin-right:5px;vertical-align:-1px}@keyframes sp{to{transform:rotate(360deg)}}
/* launchpad left edge accent on hot rows */
.trow{position:relative}
.trow:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 2px 2px 0;background:linear-gradient(180deg,#9945ff,#14f195);opacity:.55}
