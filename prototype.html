:root{--bg:#0b0c0f;--bg2:#15171c;--bg3:#1c1f26;--card:#111317;--line:#23262e;--line2:#2c3039;--txt:#e8eaed;--mut:#8a8f99;--mut2:#5d626c;--gold:#f5b942;--orange:#ff7a1a;--red2:#c1121f;--up:#2ebd85;--up2:#86d993;--down:#f6465d;--amber:#f0b90b;--acc:#86d993;--r:8px;font-size:13px}

.badge{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap}.badge.green{background:rgba(46,189,133,.14);color:var(--up)}.badge.red{background:rgba(246,70,93,.14);color:#ff8a93}.badge.amber{background:rgba(240,185,11,.14);color:var(--amber)}.badge.gray{background:#20232a;color:var(--mut)}.badge.gold{background:rgba(245,185,66,.14);color:var(--gold)}
.safety{font-weight:700;border-radius:6px;padding:4px 8px;font-size:12px}.safety.ok{background:rgba(46,189,133,.12);color:var(--up)}.safety.bad{background:rgba(246,70,93,.12);color:#ff8a93}.safety.unk{background:rgba(240,185,11,.12);color:var(--amber)}

/* =================== PROTOTYPE v2 — premium polish layer =================== */
:root{--bg:#08090b;--bg2:#12141a;--bg3:#1a1d24;--card:#0f1116;--card2:#14171d;--line:#1c2028;--line2:#262b35;--txt:#eef0f3;--mut:#8d939e;--mut2:#5f6570;--up:#2ebd85;--up2:#7fe0b0;--down:#f6465d;--blue:#4c9dff;--r:12px;font-size:14px}

.view.active{animation:vin .22s ease-out}@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.gtop{position:static;background:transparent;border:0;height:56px;gap:12px;padding:0 16px}
.brand img{border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 4px 14px rgba(255,122,26,.25)}.brand b{font-size:17px}.ver{font-size:10px;color:var(--amber);border:1px solid #4a3708;border-radius:5px;padding:0 5px;margin-left:2px;font-weight:700}
.gnav>button{font-size:13.5px;padding:8px 11px;border-radius:8px}.gnav>button.active{background:var(--bg3);box-shadow:inset 0 0 0 1px var(--line2)}
.gsearch .mag{position:absolute;left:11px;top:8px;width:16px;height:16px;color:var(--mut)}.gsearch input{height:36px;border-radius:10px;padding-left:34px;background:var(--bg2)}

.feed.off{color:var(--amber);border-color:#4a3708;background:#1a1405}.feed.off i{background:var(--amber)}@keyframes ping{70%{box-shadow:0 0 0 6px rgba(46,189,133,0)}100%{box-shadow:0 0 0 0 rgba(46,189,133,0)}}

.card,.tr-col,.gtable-wrap,.tok-main,.tradebox,.tok-head,.ns-card,.bot-card,.cmd-card,.kpi{border-radius:var(--r)}
